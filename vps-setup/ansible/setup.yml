- hosts: all
  become: true
  roles:
    - geerlingguy.swap
  tasks:
    - name: Upgrade all packages to latest version
      apt:
        upgrade: dist

    - name: Install tools
      apt:
        name:
          - htop
          - locales-all
          - rsync
          - make
          - curl
          - podman
          - podman-compose
          - ufw
          - fail2ban
        state: present
        update_cache: yes

    - name: Allow unprivileged users to bind to port 80+
      sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: '80'
        state: present
        sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf
        reload: yes

    - name: Enable lingering for {{ ansible_user }}
      command: loginctl enable-linger {{ ansible_user }}
      args:
        creates: /var/lib/systemd/linger/{{ ansible_user }}

    - name: Create /app directory
      file:
        path: /app
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
    
    - name: Ensure SSH key is present for {{ ansible_user }}
      authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('file', lookup('env', 'SSH_KEY_PATH')) }}"

    - name: Fail if VPS_PORT is not set
      fail:
        msg: "VPS_PORT environment variable must be set"
      when: ssh_port == ""

    - name: Allow ports in UFW
      ufw:
        rule: allow
        port: "{{ item }}"
      loop:
        - "{{ ssh_port }}"
        - "80"
        - "443"

    - name: Remove cloud-init SSH config
      file:
        path: /etc/ssh/sshd_config.d/50-cloud-init.conf
        state: absent
      notify: Restart SSH

    - name: Configure SSH port in sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port '
        line: 'Port {{ ssh_port }}'

    - name: Create ssh.socket override directory
      file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        mode: '0755'

    - name: Configure SSH socket port
      copy:
        dest: /etc/systemd/system/ssh.socket.d/listen.conf
        content: |
          [Socket]
          ListenStream=
          ListenStream=0.0.0.0:{{ ssh_port }}
      notify:
        - Reload systemd
        - Restart SSH

    - name: Disable SSH password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication '
        line: 'PasswordAuthentication no'
      notify: Restart SSH

    - name: Enable UFW with default deny
      ufw:
        state: enabled
        policy: deny

    - name: Configure fail2ban for SSH
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          maxretry = 5
          bantime = 3600
      notify: Restart fail2ban

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Restart SSH
      systemd:
        name: ssh.socket
        state: restarted

    - name: Restart fail2ban
      service:
        name: fail2ban
        state: restarted
