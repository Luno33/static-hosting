- hosts: all
  become: true
  roles:
    - geerlingguy.swap
  tasks:
    - name: Upgrade all packages to latest version
      apt:
        upgrade: dist

    - name: Install tools
      apt:
        name:
          - htop
          - locales-all
          - rsync
          - make
          - curl
          - podman
          - podman-compose
        state: present
        update_cache: yes

    - name: Allow unprivileged users to bind to port 80+
      sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: '80'
        state: present
        sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf
        reload: yes

    - name: Enable lingering for {{ ansible_user }}
      command: loginctl enable-linger {{ ansible_user }}
      args:
        creates: /var/lib/systemd/linger/{{ ansible_user }}

    - name: Create /app directory
      file:
        path: /app
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
    
    - name: Ensure SSH key is present for {{ ansible_user }}
      authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('file', lookup('env', 'SSH_KEY_PATH')) }}"
